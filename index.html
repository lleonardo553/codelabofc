<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calculadora Online</title>
  <style>
    /* Reset e estilização geral */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background: linear-gradient(135deg, #0f172a, #1e293b);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    /* Container da Calculadora */
    .calculator {
      background-color: #1e293b;
      padding: 25px;
      border-radius: 20px;
      box-shadow: 0 15px 30px rgba(0, 0, 0, 0.4);
      width: 100%;
      max-width: 360px;
      border: 1px solid rgba(255, 255, 255, 0.05);
    }

    /* Display */
    .display {
      background-color: #0f172a;
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 20px;
      text-align: right;
      word-wrap: break-word;
      word-break: break-all;
    }

    .display .previous-operand {
      color: #94a3b8;
      font-size: 0.9rem;
      min-height: 20px;
      margin-bottom: 5px;
    }

    .display .current-operand {
      color: #ffffff;
      font-size: 2.2rem;
      font-weight: 600;
      min-height: 40px;
    }

    /* Grade de Botões */
    .buttons {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
    }

    button {
      background-color: #334155;
      color: #f8fafc;
      border: none;
      outline: none;
      border-radius: 12px;
      padding: 18px 0;
      font-size: 1.2rem;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s ease;
      user-select: none;
    }

    button:hover {
      background-color: #475569;
      transform: translateY(-2px);
    }

    button:active {
      transform: translateY(0);
    }

    /* Botões Especiais */
    button.operator {
      background-color: #3b82f6;
      color: #ffffff;
    }

    button.operator:hover {
      background-color: #2563eb;
    }

    button.action {
      background-color: #ef4444;
      color: #ffffff;
    }

    button.action:hover {
      background-color: #dc2626;
    }

    button.equals {
      background-color: #10b981;
      color: #ffffff;
      grid-column: span 2;
    }

    button.equals:hover {
      background-color: #059669;
    }
  </style>
</head>
<body>

  <div class="calculator">
    <div class="display">
      <div id="previous-operand" class="previous-operand"></div>
      <div id="current-operand" class="current-operand">0</div>
    </div>
    
    <div class="buttons">
      <button class="action" onclick="clearDisplay()">C</button>
      <button class="action" onclick="deleteDigit()">DEL</button>
      <button class="operator" onclick="appendOperator('%')">%</button>
      <button class="operator" onclick="appendOperator('÷')">÷</button>
      
      <button onclick="appendNumber('7')">7</button>
      <button onclick="appendNumber('8')">8</button>
      <button onclick="appendNumber('9')">9</button>
      <button class="operator" onclick="appendOperator('×')">×</button>
      
      <button onclick="appendNumber('4')">4</button>
      <button onclick="appendNumber('5')">5</button>
      <button onclick="appendNumber('6')">6</button>
      <button class="operator" onclick="appendOperator('-')">-</button>
      
      <button onclick="appendNumber('1')">1</button>
      <button onclick="appendNumber('2')">2</button>
      <button onclick="appendNumber('3')">3</button>
      <button class="operator" onclick="appendOperator('+')">+</button>
      
      <button onclick="appendNumber('0')">0</button>
      <button onclick="appendNumber('.')">.</button>
      <button class="equals" onclick="calculate()">=</button>
    </div>
  </div>

  <script>
    let currentOperand = '0';
    let previousOperand = '';
    let operation = null;

    const currentOperandElement = document.getElementById('current-operand');
    const previousOperandElement = document.getElementById('previous-operand');

    function updateDisplay() {
      currentOperandElement.innerText = currentOperand;
      if (operation != null) {
        previousOperandElement.innerText = `${previousOperand} ${operation}`;
      } else {
        previousOperandElement.innerText = '';
      }
    }

    function appendNumber(number) {
      if (number === '.' && currentOperand.includes('.')) return;
      if (currentOperand === '0' && number !== '.') {
        currentOperand = number;
      } else {
        currentOperand += number;
      }
      updateDisplay();
    }

    function appendOperator(op) {
      if (currentOperand === '' && previousOperand === '') return;
      
      if (previousOperand !== '') {
        calculate();
      }
      
      operation = op;
      previousOperand = currentOperand;
      currentOperand = '';
      updateDisplay();
    }

    function clearDisplay() {
      currentOperand = '0';
      previousOperand = '';
      operation = null;
      updateDisplay();
    }

    function deleteDigit() {
      if (currentOperand.length === 1 || (currentOperand.length === 2 && currentOperand.startsWith('-'))) {
        currentOperand = '0';
      } else {
        currentOperand = currentOperand.slice(0, -1);
      }
      updateDisplay();
    }

    function calculate() {
      let result;
      const prev = parseFloat(previousOperand);
      const current = parseFloat(currentOperand);

      if (isNaN(prev) || isNaN(current)) return;

      switch (operation) {
        case '+':
          result = prev + current;
          break;
        case '-':
          result = prev - current;
          break;
        case '×':
          result = prev * current;
          break;
        case '÷':
          if (current === 0) {
            alert("Não é possível dividir por zero!");
            clearDisplay();
            return;
          }
          result = prev / current;
          break;
        case '%':
          result = (prev * current) / 100;
          break;
        default:
          return;
      }

      currentOperand = result.toString();
      operation = null;
      previousOperand = '';
      updateDisplay();
    }

    // Suporte ao Teclado do Computador
    document.addEventListener('keydown', (event) => {
      if (event.key >= '0' && event.key <= '9') appendNumber(event.key);
      if (event.key === '.') appendNumber('.');
      if (event.key === '+') appendOperator('+');
      if (event.key === '-') appendOperator('-');
      if (event.key === '*') appendOperator('×');
      if (event.key === '/') appendOperator('÷');
      if (event.key === '%') appendOperator('%');
      if (event.key === 'Enter' || event.key === '=') {
        event.preventDefault();
        calculate();
      }
      if (event.key === 'Backspace') deleteDigit();
      if (event.key === 'Escape') clearDisplay();
    });
  </script>
</body>
</html>
